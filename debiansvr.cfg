### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Set hostname and domain names
#### Replace <DOMAINNAME> with your domain ####
d-i netcfg/get_hostname string server
d-i netcfg/get_domain string <DOMAINNAME>

# Force the installer to stick to your specific interface name
d-i netcfg/choose_interface select enX0

### Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account Setup
# Enable root login and set the root password
d-i passwd/root-login boolean true
d-i passwd/root-password password changeme
d-i passwd/root-password-again password changeme

# Create ordinary user account
#### Replace <NAME> with the useranme you want ####
d-i passwd/user-fullname string <NAME>
d-i passwd/username string <NAME>
d-i passwd/user-password password changeme
d-i passwd/user-password-again password changeme

# Explicitly add bill to the sudo group since root is enabled
d-i passwd/user-default-groups string sudo

### Clock and Time Zone Setup
d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true

### Partitioning
# Use the entire disk, single partition layout, no LVM
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_mount_check boolean true

### Package Selection
# Standard system tools, SSH Server, and NO GUI desktop environment
tasksel tasksel/first multiselect standard, ssh-server

# FIX: Removed xe-guest-utilities from this line to stop the installer from crashing
d-i pkgsel/include string sudo resolvconf

# Policy for upgrades (no automatic upgrades right away)
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Boot Changer / GRUB Installation
# Install GRUB automatically to the main MBR/EFI drive without prompting
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Network Configuration
# Disable network autoconfiguration (DHCP)
d-i netcfg/disable_autoconfig boolean true

### Finishing up the installation
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

### Overwrite Network Configuration via Late Command
#### Change IPs to match your network ####
d-i preseed/late_command string \
echo "auto enX0" > /target/etc/network/interfaces; \
echo "iface enX0 inet static" >> /target/etc/network/interfaces; \
echo "    address 192.168.0.99" >> /target/etc/network/interfaces; \
echo "    netmask 255.255.255.0" >> /target/etc/network/interfaces; \
echo "    gateway 192.168.0.1" >> /target/etc/network/interfaces; \
echo "    dns-nameservers 1.1.1.1" >> /target/etc/network/interfaces;
